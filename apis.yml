- name: Railway API
  description: >-
    Railway is a modern deployment platform with usage-based pricing and arguably the best developer experience
    of any deployment platform. Launched in 2020, by 2026 it has matured with support for persistent volumes,
    private networking, cron jobs, TCP proxy, and one-click database deployments. The API manages projects,
    services, deployments, environments, and variables.
